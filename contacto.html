<body>
    <video autoplay loop muted poster="imagen-de-carga.jpg" id="video-fondo">
        <source src="./video/cruceros.mp4" type="video/mp4">

    <nav class="navegacion">
        <ul>

    <div class="titulo2">
        <h1>Contáctanos</h1>
    </div>
    <form class="formulario">
    
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre">

    <label for="correo">Correo</label>
    <input type="email" id="correo" name="correo" placeholder="Ingrese su correo">

    <label for="telefono">Teléfono</label>
    <input type="tel" id="telefono" name="telefono" placeholder="Ingrese su teléfono">

    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" name="mensaje" placeholder="Escriba su mensaje"></textarea>

    <button type="submit">Enviar</button>

</form>
